name: Daily Claude Share Export

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          pip install curl_cffi firebase-admin ddgs
      - run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > /tmp/firebase-key.json
      - run: python discover_links.py --max 50
      - id: export
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: /tmp/firebase-key.json
        run: |
          python claude_sharedchats.py links.txt --firebase-upload chats -o exports
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - if: always()
        run: |
          echo "Export exit code: ${{ steps.export.outputs.exit_code }}"
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/ links.txt
          git diff --staged --quiet || git commit -m "daily export: $(date +'%Y-%m-%d')"
          git push
