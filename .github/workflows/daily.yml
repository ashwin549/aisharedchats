name: Daily Claude Share Export

on:
  schedule:
    # Runs every day at 08:00 UTC (1:30 PM IST)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi firebase-admin ddgs

      - name: Discover new Claude share links from search
        run: |
          python discover_links.py --max 50

      - name: Run export + upload to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          python claude_sharedchats.py links.txt --firebase-upload chats -o exports

      - name: Commit updated links & manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-share-export.json exports/ links.txt
          git diff --staged --quiet || git commit -m "daily export: $(date +'%Y-%m-%d')"
          git push
