name: Daily Claude Share Export

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi firebase-admin ddgs

      - name: Write Firebase service account to temp file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > /tmp/firebase-key.json

      - name: Discover new Claude share links from search
        run: |
          python discover_links.py --max 50

      - name: Run export + upload to Firebase
        id: export
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: /tmp/firebase-key.json
        run: |
          python claude_sharedchats.py links.txt --firebase-upload chats -o exports
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Report export result
        if: always()
        run: |
          echo "Export exit code: ${{ steps.export.outputs.exit_code || 'unknown' }}"
          if [ "${{ steps.export.outputs.exit_code }}" != "0" ]; then
            echo "⚠️ Export completed with errors (some links may have failed)"
          else
            echo "✅ Export completed successfully"
          fi

      - name: Commit updated links & manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/ links.txt
          git diff --staged --quiet || git commit -m "daily export: $(date +'%Y-%m-%d')"
          git push
